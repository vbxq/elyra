[package]
name = "aelys"
version.workspace = true
edition = "2024"

[dependencies]
aelys-common = { path = "../common" }
aelys-syntax = { path = "../syntax" }
aelys-frontend = { path = "../frontend" }
aelys-sema = { path = "../sema" }
aelys-opt = { path = "../opt" }
aelys-bytecode = { path = "../bytecode" }
aelys-backend = { path = "../backend" }
aelys-runtime = { path = "../runtime" }
aelys-native = { path = "../native" }
aelys-modules = { path = "../modules" }
aelys-driver = { path = "../driver" }
cranelift-codegen = "0.134.2"
cranelift-frontend = "0.134.2"
cranelift-jit = "0.134.2"
cranelift-module = "0.134.2"
cranelift-native = "0.134.2"
smallvec = "1.15"

[dev-dependencies]
tempfile = "3"
aelys-opt = { path = "../opt" }
aelys-bytecode = { path = "../bytecode" }
criterion = "0.8.2"
iai-callgrind = "0.16.1"

[build-dependencies]
regex = "1"

[lib]
doctest = false

[[bench]]
name = "criterion_runtime"
harness = false

[[bench]]
name = "iai_runtime"
harness = false
