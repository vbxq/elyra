[workspace]
resolver = "3"
members = [
    "aelys",
    "common",
    "syntax",
    "frontend",
    "sema",
    "opt",
    "bytecode",
    "backend",
    "runtime",
    "modules",
    "driver",
    "cli",
    "native",
    "native-macros",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.22.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
debug = false
overflow-checks = false
debug-assertions = false
rpath = false
